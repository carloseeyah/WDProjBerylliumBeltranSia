<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rotten To The Core: A Descendants Guide">
    <meta name="author" content="EC Beltran, CM Sia">
    <link rel="stylesheet" href="profile.css">
    <link rel="icon" type="image/png" href="https://logos-world.net/wp-content/uploads/2023/06/Descendants-Symbol.png">
    <script src="profile.js"></script>
    <title>Profile - Rotten To The Core: A Descendants Guide</title>
</head>

<body>
    <main>
        <div class="profileForm">
            <div class="Mirror">
                <img id="profilePic" src="" alt="Mirror Image"> <!-- mirror image of selected character -->
            </div>
        
        <div class="profile-container">
            <h1>Profile</h1>
            <div id="profileDisplay">
                <p><strong>Username:</strong> <span id="displayUsername"></span></p>
                <p><strong>Selected Character:</strong> <span id="displayCharacter"></span></p>
                <p><strong>Password:</strong> <span id="displayPassword">********</span></p>
                <button id="editBtn">Edit Profile</button>
                <button type="button" class="home" onclick="window.location.href='../index.html'">Back To Home</button>
            </div>
            <form id="profileForm" style="display: none;"> <!-- separate and hidden -->

                <!-- form inputs for editing -->
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br>
                <label for="character">Selected Character:</label>
                
                <select id="character" name="character" required>
                    <option value="">--Select a character--</option>
                    <option value="Mal">Mal</option>
                    <option value="Evie">Evie</option>
                    <option value="Carlos">Carlos</option>
                    <option value="Jay">Jay</option>
                    <option value="Ben">Ben</option>
                </select><br>

                <button type="submit">Save Changes</button>
                <button type="button" id="cancelBtn">Cancel</button>
            </form>
            <p id="welcomeMsg">Welcome to your profile!</p>
        </div>
        </div>

        <footer>
            2025 PSHS MC Beryllium | All Rights Reserved --
            <a href="References.html">References</a>
        </footer>
    </main>
</body>
